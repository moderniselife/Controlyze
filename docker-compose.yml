version: "3.8"

services:
  controlyze:
    image: ghcr.io/josephshenton/controlyze:latest
    container_name: controlyze
    restart: unless-stopped
    user: "1001:1001"
    group_add:
      - "${DOCKER_GID:-998}"
    ports:
      - "3100:3000"
    volumes:
      # Mount Docker socket for container monitoring
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Persist configuration and database
      - ./data:/app/data
    environment:
      - TZ=Australia/Sydney
      # Discord Integration
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      # - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      # Linear Integration
      - LINEAR_API_KEY=${LINEAR_API_KEY}
      - LINEAR_TEAM_ID=${LINEAR_TEAM_ID}
    # Optional: Add to your existing network
    # networks:
    #   - your-network
